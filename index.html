<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YDC 골프 내기 — Golf Bet Tracker</title>
  <meta name="description" content="홀마다 자동 저장되는 오프라인 골프 내기 정산 앱. YDC 모드 / 오장 모드, 니어·롱기 이월, 최소 이체 정산.">
  <meta name="color-scheme" content="light dark">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#14532d">
  <meta name="application-name" content="YDC 골프 내기">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YDC 골프">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">

  <style>/* ============================================================================
 * YDC Golf Bet — 스타일 (아이폰 390px 기준, 야외에서 잘 보이게)
 * ==========================================================================*/

:root {
  --bg: #eef2ea;
  --bg-top: #f8faf6;
  --card: #ffffff;
  --card-2: #f6f8f4;
  --ink: #0b1b12;
  --ink-2: #33443a;
  --muted: #5c6b61;
  --line: #dbe3d7;
  --line-strong: #c2cfbd;

  --brand: #14532d;
  --brand-2: #1c6b3b;
  --brand-ink: #ffffff;
  --gold: #f7bb07;
  --gold-soft: #fff3cf;
  --gold-ink: #43310a;   /* 금색 배경 위 글자(항상 어둡게) */
  --gold-text: #43310a;  /* 연한 금색 배경 위 글자 */

  --win: #0b7a3b;
  --win-soft: #e6f6ec;
  --lose: #b91c1c;
  --lose-soft: #fdeaea;
  --info-soft: #e9f0fb;
  --info-ink: #123a6b;

  --radius: 16px;
  --radius-sm: 12px;
  --shadow: 0 2px 10px rgba(10, 30, 18, .08);
  --tap: 52px;
}

[data-theme="dark"] {
  --bg: #0b1218;
  --bg-top: #101a22;
  --card: #151f28;
  --card-2: #1b2731;
  --ink: #eef4f7;
  --ink-2: #c8d4dc;
  --muted: #96a5b0;
  --line: #26333d;
  --line-strong: #35454f;

  --brand: #0f3d22;
  --brand-2: #17693c;
  --brand-ink: #f4fff8;
  --gold: #ffc92e;
  --gold-soft: #3a2f0a;
  --gold-ink: #2a1f04;
  --gold-text: #ffe9a8;

  --win: #4ade80;
  --win-soft: #123324;
  --lose: #fca5a5;
  --lose-soft: #3a1515;
  --info-soft: #16283d;
  --info-ink: #bcd7ff;

  --shadow: 0 2px 12px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
               "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  padding-bottom: env(safe-area-inset-bottom);
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; border: 0; background: none; }

.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ------------------------------------------------------------- 레이아웃 */

#root {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 14px calc(120px + env(safe-area-inset-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  margin: 0 -14px 12px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: var(--brand);
  color: var(--brand-ink);
  border-bottom: 3px solid var(--gold);
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar .brand {
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.topbar .brand .flag { font-size: 1.2rem; line-height: 1; }

.topbar .spacer { flex: 1; }

.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .14);
  color: inherit;
  font-size: 1.05rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
}
.icon-btn:active { background: rgba(255, 255, 255, .28); }

.page-title {
  font-size: 1.35rem;
  font-weight: 900;
  letter-spacing: -0.4px;
  margin: 6px 2px 12px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}

.card.tight { padding: 10px 12px; }
.card.flat { box-shadow: none; }

.section-label {
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 16px 2px 8px;
}
.section-label:first-child { margin-top: 2px; }

.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tiny { font-size: .76rem; }
.right { text-align: right; }
.center { text-align: center; }
.bold { font-weight: 800; }
.mt { margin-top: 10px; }
.nowrap { white-space: nowrap; }

/* ------------------------------------------------------------- 버튼 */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 1.02rem;
  font-weight: 800;
  border: 1.5px solid transparent;
  transition: transform .04s ease, filter .12s ease;
  user-select: none;
}
.btn:active { transform: scale(.985); filter: brightness(.96); }
.btn[disabled] { opacity: .45; pointer-events: none; }

.btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
[data-theme="dark"] .btn-primary { background: var(--brand-2); border-color: var(--brand-2); }
.btn-gold { background: var(--gold); color: var(--gold-ink); border-color: #d9a400; }
.btn-ghost { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
.btn-soft { background: var(--card-2); color: var(--ink-2); border-color: var(--line); }
.btn-danger { background: var(--lose-soft); color: var(--lose); border-color: currentColor; }
.btn-sm {
  min-height: 40px;
  padding: 8px 12px;
  font-size: .9rem;
  border-radius: 11px;
  width: auto;
}
.btn-row { display: flex; gap: 10px; }
.btn-row > .btn { flex: 1; }

/* ------------------------------------------------------------- 배지 */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 800;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  white-space: nowrap;
}
.pill.gold { background: var(--gold-soft); border-color: #e8c65a; color: var(--gold-text); }
.pill.green { background: var(--win-soft); border-color: #a7dbba; color: var(--win); }
.pill.blue { background: var(--info-soft); border-color: #bcd2f2; color: var(--info-ink); }
.pill.red { background: var(--lose-soft); border-color: #f0b6b6; color: var(--lose); }
.pill.xl { font-size: 1rem; padding: 8px 14px; }

.tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: .72rem;
  font-weight: 800;
  background: var(--card-2);
  color: var(--muted);
  border: 1px solid var(--line);
}

/* ------------------------------------------------------------- 폼 */

.field { margin-bottom: 14px; }
.field > label {
  display: block;
  font-size: .82rem;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 6px;
}
.input, select.input {
  width: 100%;
  min-height: 50px;
  padding: 12px 14px;
  border-radius: 13px;
  border: 1.5px solid var(--line-strong);
  background: var(--card);
  color: var(--ink);
  font-size: 1.05rem;
  font-weight: 700;
  -webkit-appearance: none;
  appearance: none;
}
.input:focus { outline: 3px solid rgba(20, 83, 45, .25); border-color: var(--brand-2); }
select.input {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}

.seg {
  display: flex;
  gap: 8px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px;
}
.seg button {
  flex: 1;
  min-height: 46px;
  border-radius: 11px;
  font-weight: 800;
  font-size: .98rem;
  color: var(--muted);
}
.seg button.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
  border: 1px solid var(--line-strong);
}
.seg.mode button.on { background: var(--brand); color: #fff; border-color: var(--brand); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button {
  min-height: 42px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--line-strong);
  background: var(--card);
  font-weight: 800;
  font-size: .92rem;
  color: var(--ink-2);
}
.chips button.on {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
}
.switch {
  position: relative;
  width: 58px;
  height: 34px;
  flex: none;
}
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; }
.switch span {
  position: absolute;
  inset: 0;
  background: var(--line-strong);
  border-radius: 999px;
  transition: background .15s;
  pointer-events: none;
}
.switch span::after {
  content: "";
  position: absolute;
  top: 4px; left: 4px;
  width: 26px; height: 26px;
  background: #fff;
  border-radius: 50%;
  transition: transform .15s;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
}
.switch input:checked + span { background: var(--brand-2); }
.switch input:checked + span::after { transform: translateX(24px); }

.hole-selects { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* ------------------------------------------------------------- 홈 */

.hero {
  background: linear-gradient(160deg, var(--brand) 0%, #0e3a20 100%);
  color: #fff;
  border-radius: 20px;
  padding: 20px 18px;
  margin-bottom: 14px;
  border: 2px solid var(--gold);
}
.hero h1 {
  margin: 0 0 4px;
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: -0.5px;
}
.hero p { margin: 0; font-size: .92rem; opacity: .9; }
.hero .gold { color: var(--gold); }

.round-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.round-item:last-child { border-bottom: 0; }
.round-item .grow { flex: 1; min-width: 0; }
.round-item .title {
  font-weight: 800;
  font-size: 1rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ------------------------------------------------------------- 플레이 */

.hole-head {
  display: flex;
  align-items: stretch;
  gap: 10px;
  margin-bottom: 12px;
}
.hole-num {
  flex: none;
  min-width: 104px;
  background: var(--brand);
  color: #fff;
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
  border: 2px solid var(--gold);
}
.hole-num .label { font-size: .7rem; font-weight: 800; letter-spacing: .08em; opacity: .85; }
.hole-num .value { font-size: 1.9rem; font-weight: 900; line-height: 1.1; }
.hole-num .value small { font-size: 1rem; opacity: .8; font-weight: 700; }

.mult-box {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}
.mult-box .top { display: flex; align-items: baseline; gap: 8px; }
.mult-box .mult { font-size: 1.55rem; font-weight: 900; color: var(--lose); line-height: 1.1; }
.mult-box .why { font-size: .76rem; color: var(--muted); font-weight: 700; }
.mult-box .per { font-size: .78rem; color: var(--ink-2); font-weight: 700; margin-top: 2px; }

.player {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 10px;
}
.player.honor { border-left-color: var(--gold); }
.player.active { box-shadow: 0 0 0 2px rgba(20, 83, 45, .25); }

.player-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.player-head .role {
  font-size: .72rem;
  font-weight: 900;
  padding: 3px 8px;
  border-radius: 7px;
  background: var(--card-2);
  color: var(--muted);
  border: 1px solid var(--line);
  flex: none;
}
.player-head .role.honor { background: var(--gold); color: var(--gold-ink); border-color: #d9a400; }
.player-head .name {
  font-weight: 900;
  font-size: 1.08rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.player-head .delta { font-weight: 900; font-size: .92rem; }
.delta.pos { color: var(--win); }
.delta.neg { color: var(--lose); }

.score-row { display: flex; align-items: stretch; gap: 10px; }
.stepper {
  width: 64px;
  min-height: 62px;
  border-radius: 14px;
  border: 1.5px solid var(--line-strong);
  background: var(--card-2);
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.stepper:active { background: var(--line); }

.score-btn {
  flex: 1;
  min-height: 62px;
  border-radius: 14px;
  border: 2px solid var(--line-strong);
  background: var(--card);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 4px;
}
.score-btn .num { font-size: 1.75rem; font-weight: 900; line-height: 1.05; }
.score-btn .word { font-size: .74rem; font-weight: 800; color: var(--muted); }
.score-btn.under { border-color: #2e7d32; background: var(--win-soft); }
.score-btn.under .num, .score-btn.under .word { color: var(--win); }
.score-btn.over { border-color: #d08a8a; background: var(--lose-soft); }
.score-btn.over .num, .score-btn.over .word { color: var(--lose); }
.score-btn:active { transform: scale(.98); }

.side-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.side-chips button {
  min-height: 42px;
  padding: 8px 12px;
  border-radius: 11px;
  border: 1.5px solid var(--line);
  background: var(--card-2);
  font-size: .86rem;
  font-weight: 800;
  color: var(--muted);
  flex: 1 1 30%;
}
.side-chips .side-label {
  align-self: center;
  font-size: .78rem;
  font-weight: 900;
  color: var(--muted);
  min-width: 30px;
}
.side-chips button.on { background: var(--info-soft); border-color: #6f9ede; color: var(--info-ink); }
.side-chips button.erase.on { background: var(--lose-soft); border-color: #e08a8a; color: var(--lose); }

.double-btn {
  margin-top: 8px;
  width: 100%;
  min-height: 44px;
  border-radius: 11px;
  border: 1.5px dashed var(--line-strong);
  background: var(--card-2);
  font-size: .88rem;
  font-weight: 800;
  color: var(--ink-2);
}
.double-btn.on { border-style: solid; border-color: var(--lose); background: var(--lose-soft); color: var(--lose); }
.double-btn[disabled] { opacity: .5; }

.footer-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  z-index: 40;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, rgba(0, 0, 0, 0));
}
.footer-inner {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: stretch;
}
.footer-inner .btn { min-height: 58px; font-size: 1.08rem; }
.footer-inner .side-btn { flex: none; width: 60px; min-height: 58px; border-radius: 14px; }

/* ------------------------------------------------------------- 결과 */

.result-head {
  text-align: center;
  padding: 6px 0 2px;
}
.result-head .hole { font-size: 1.5rem; font-weight: 900; }
.result-head .sub { color: var(--muted); font-size: .86rem; font-weight: 700; }

.score-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
.score-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--card-2);
  border: 1.5px solid var(--line);
  font-weight: 800;
  font-size: .9rem;
}
.score-chip b { font-size: 1.05rem; }
.score-chip.under { background: var(--win-soft); border-color: #a7dbba; color: var(--win); }
.score-chip.over { background: var(--lose-soft); border-color: #e8b4b4; color: var(--lose); }

.tx-list { list-style: none; margin: 0; padding: 0; }
.tx-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: .95rem;
}
.tx-list li:last-child { border-bottom: 0; }
.tx-list .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-list .amt { font-weight: 900; white-space: nowrap; }

.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }

.next-mult {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--gold-soft);
  border: 1.5px solid #e8c65a;
  border-radius: 13px;
  padding: 10px 12px;
  color: var(--gold-text);
  font-weight: 800;
  font-size: .92rem;
}
.next-mult .x { font-size: 1.2rem; font-weight: 900; }

/* ------------------------------------------------------------- 표 */

table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: .95rem;
}
table.data th {
  text-align: left;
  font-size: .74rem;
  letter-spacing: .03em;
  color: var(--muted);
  font-weight: 800;
  padding: 6px 4px;
  border-bottom: 1.5px solid var(--line-strong);
}
table.data td {
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
table.data tr:last-child td { border-bottom: 0; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.total td { font-weight: 900; border-top: 2px solid var(--line-strong); }
.pos { color: var(--win); font-weight: 900; }
.neg { color: var(--lose); font-weight: 900; }

.history-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.history-row:last-child { border-bottom: 0; }
.hole-badge {
  flex: none;
  width: 42px; height: 42px;
  border-radius: 11px;
  background: var(--brand);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}

/* ------------------------------------------------------------- 모달/토스트 */

.modal-back {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(6, 16, 10, .55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 88vh;
  overflow: auto;
  animation: slide .18s ease;
  border-top: 4px solid var(--gold);
}
@keyframes slide { from { transform: translateY(24px); } to { transform: translateY(0); } }

.modal h3 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 900; }
.modal .modal-body { margin: 6px 0 14px; }
.modal .modal-actions { display: flex; flex-direction: column; gap: 9px; }
.modal .modal-actions .btn-row { gap: 9px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(10, 25, 16, .94);
  color: #fff;
  padding: 12px 18px;
  border-radius: 14px;
  font-weight: 800;
  font-size: .92rem;
  max-width: 88vw;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s;
}
.toast.show { opacity: 1; }

/* 공유 카드(캔버스) 숨김 */
#shareCanvas { display: none; }

.print-line { border-top: 1px dashed var(--line-strong); margin: 12px 0; }

.note {
  background: var(--info-soft);
  color: var(--info-ink);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: .84rem;
  font-weight: 700;
  line-height: 1.45;
}
.note.warn { background: var(--lose-soft); color: var(--lose); }
.note.gold { background: var(--gold-soft); color: var(--gold-text); }

.kbd-hint { font-size: .8rem; color: var(--muted); }</style>
</head>
<body>
  <div id="root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <div style="padding:24px;font-family:sans-serif">이 앱은 자바스크립트가 필요합니다. 사파리에서 다시 열어 주세요.</div>
  </noscript>

  <script>/* ============================================================================
 * YDC Golf Bet — 규칙 엔진 (순수 함수)
 *
 * 이 파일에는 DOM, localStorage, 네트워크 코드가 하나도 없다.
 * 모든 화면은 "history + initialPlayers" 만 있으면 여기서 계산된 결과를 그린다.
 * 즉, 돈 계산의 단일 원천은 history 이고, 화면은 그 결과를 표시만 한다.
 * ==========================================================================*/
var YDC = (function () {
  'use strict';

  var VERSION = '1.0.0';

  var MODE = { YDC: 'ydc', OJANG: 'ojang' };
  var SCORE_MIN = -3;
  var SCORE_MAX = 5;

  /* 언더파 보너스 배수: 버디 ×1, 이글 ×5, -3 ×10 */
  function underParUnits(score) {
    if (score <= -3) return 10;
    if (score === -2) return 5;
    if (score === -1) return 1;
    return 0;
  }

  function num(v) {
    var n = Number(v);
    return isFinite(n) ? n : 0;
  }

  function clampScore(v) {
    var n = Math.round(num(v));
    if (n < SCORE_MIN) return SCORE_MIN;
    if (n > SCORE_MAX) return SCORE_MAX;
    return n;
  }

  function won(n) {
    return '₩' + Math.round(num(n)).toLocaleString('ko-KR');
  }

  function signedWon(n) {
    var v = Math.round(num(n));
    return (v > 0 ? '+' : v < 0 ? '-' : '') + '₩' + Math.abs(v).toLocaleString('ko-KR');
  }

  function scoreName(s) {
    var names = {
      '-3': '알바트로스', '-2': '이글', '-1': '버디', '0': '파',
      '1': '보기', '2': '더블보기', '3': '트리플보기', '4': '쿼드러플', '5': '펜타'
    };
    return names[String(s)] || String(s);
  }

  /* ---------------------------------------------------------------- 배율 */

  function countsOf(scores) {
    var map = {}, unique = [];
    for (var i = 0; i < scores.length; i++) {
      var s = scores[i];
      if (map[s] === undefined) { map[s] = 0; unique.push(s); }
      map[s] += 1;
    }
    return { map: map, unique: unique };
  }

  /* YDC 모드: 후보 중 가장 큰 배율 하나만 적용 (중첩 없음) */
  function ydcAnalysis(scores) {
    var list = (scores || []).map(clampScore);
    if (!list.length) return { mult: 1, notes: ['배율 없음 → ×1'], candidates: [1] };
    var c = countsOf(list);
    var n = list.length;
    var anyEdge = list.some(function (s) { return s <= -1 || s >= 3; });
    var allZero = list.every(function (s) { return s === 0; });
    var cands = [1];
    var notes = [];

    if (c.unique.length === 1) {
      if (allZero) { cands.push(10); notes.push('전원 파 → ×10'); }
      else { cands.push(5); notes.push('전원 같은 타수 → ×5'); }
    } else {
      var tie3 = false, tie2 = false;
      c.unique.forEach(function (v) {
        if (c.map[v] === 3) tie3 = true;
        if (c.map[v] === 2) tie2 = true;
      });
      if (tie3) { cands.push(3); notes.push('3명 동타 → ×3'); }
      if (tie2) { cands.push(2); notes.push('2명 동타 → ×2'); }
      if (c.unique.length === n) {
        var mn = Math.min.apply(null, c.unique);
        var mx = Math.max.apply(null, c.unique);
        if (mx - mn + 1 === n) { cands.push(5); notes.push('스트레이트 → ×5'); }
      }
    }
    if (anyEdge) { cands.push(2); notes.push('-1 이하 또는 +3 이상 발생 → ×2'); }

    return {
      mult: Math.max.apply(null, cands),
      notes: notes.length ? notes : ['배율 없음 → ×1'],
      candidates: cands
    };
  }

  /* 오장(스탠다드) 모드 */
  function ojangAnalysis(scores) {
    var list = (scores || []).map(clampScore);
    if (!list.length) return { mult: 1, notes: ['배율 없음 → ×1'], candidates: [1] };
    var notes = [];
    if (list.some(function (s) { return s <= -1; })) notes.push('언더파 발생 → ×2');
    if (list.some(function (s) { return s >= 3; })) notes.push('+3 이상 발생 → ×2');
    var mn = Math.min.apply(null, list);
    var cnt = list.filter(function (s) { return s === mn; }).length;
    if (cnt >= 2) notes.push('최저 타수 동타 → ×2');
    return {
      mult: notes.length ? 2 : 1,
      notes: notes.length ? notes : ['배율 없음 → ×1'],
      candidates: notes.length ? [1, 2] : [1]
    };
  }

  function analysisFor(mode, scores) {
    return mode === MODE.OJANG ? ojangAnalysis(scores) : ydcAnalysis(scores);
  }

  function nextMultiplier(mode, scores) {
    return analysisFor(mode, scores).mult;
  }

  /* ------------------------------------------------------- 홀 기본 정산 */

  /**
   * 모든 짝이 서로 정산: (타수 차) × 기본 배팅 × 배율
   * 낮은 타수(잘 친 사람)가 받는다.
   */
  function settlementForHole(scores, base, mult) {
    var n = scores.length;
    var pairwise = [];
    var netMoney = [];
    for (var i = 0; i < n; i++) netMoney.push(0);

    for (var a = 0; a < n; a++) {
      for (var b = a + 1; b < n; b++) {
        if (scores[a] === scores[b]) continue;
        var better = scores[a] < scores[b] ? a : b;
        var worse = scores[a] < scores[b] ? b : a;
        var diff = Math.abs(scores[a] - scores[b]);
        var amount = diff * num(base) * num(mult);
        pairwise.push({ from: worse, to: better, amount: amount });
        netMoney[worse] -= amount;
        netMoney[better] += amount;
      }
    }
    return { pairwise: pairwise, netMoney: netMoney };
  }

  /** 언더파 보너스: 버디/이글/-3 은 나보다 못 친 모든 사람에게 각각 받는다. */
  function performanceTransfers(scores, base, mult) {
    var out = [];
    var n = scores.length;
    for (var i = 0; i < n; i++) {
      var units = underParUnits(scores[i]);
      if (!units) continue;
      var amount = units * num(base) * num(mult);
      for (var j = 0; j < n; j++) {
        if (scores[j] > scores[i]) {
          out.push({ from: j, to: i, amount: amount, side: 'performance', units: units });
        }
      }
    }
    return out;
  }

  /**
   * 최소 이체: 채권자/채무자를 금액 큰 순으로 맞춰 없앤다.
   * (기존 앱과 동일한 알고리즘 — 결과가 달라지지 않게 그대로 유지)
   */
  function simplifyTransfers(netMoney) {
    var creditors = [], debtors = [];
    netMoney.forEach(function (v, i) {
      if (v > 0) creditors.push({ i: i, amt: v });
      else if (v < 0) debtors.push({ i: i, amt: -v });
    });
    creditors.sort(function (a, b) { return b.amt - a.amt; });
    debtors.sort(function (a, b) { return b.amt - a.amt; });

    var out = [];
    var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
      var c = creditors[ci], d = debtors[di];
      var pay = Math.min(c.amt, d.amt);
      if (pay > 0) out.push({ from: d.i, to: c.i, amount: pay });
      c.amt -= pay;
      d.amt -= pay;
      if (Math.abs(c.amt) < 1e-9) ci++;
      if (Math.abs(d.amt) < 1e-9) di++;
    }
    return out;
  }

  /* ---------------------------------------------------- 니어 / 롱기 정산 */

  /** 지급 단위 = (이월 횟수 + 1) × 기본 배팅 × 배율 */
  function sideUnit(potCount, base, mult) {
    return (Math.max(0, num(potCount)) + 1) * num(base) * num(mult);
  }

  /* ------------------------------------------------------- 오너(티 순서) */

  function scoreOf(entry, uid) {
    if (!entry || !entry.uids) return null;
    var i = entry.uids.indexOf(uid);
    if (i === -1) return null;
    var s = entry.scores ? entry.scores[i] : null;
    return typeof s === 'number' ? s : null;
  }

  /**
   * 다음 홀 오너 순서.
   * 1) 직전 홀 타수 오름차순
   * 2) 같으면 앞 홀들로 거슬러 올라가며 비교
   * 3) 그래도 같으면 최초 순서
   */
  function teeOrderUids(holes, initialOrder, nextHole) {
    var uids = initialOrder.slice();
    var byHole = {};
    (holes || []).forEach(function (h) { byHole[h.hole] = h; });

    if (nextHole <= 1 || !holes || !holes.length) return uids;

    var prev = byHole[nextHole - 1] || null;

    function walkBack(aUid, bUid) {
      for (var h = nextHole - 2; h >= 1; h--) {
        var e = byHole[h];
        if (!e) continue;
        var sa = scoreOf(e, aUid), sb = scoreOf(e, bUid);
        if (sa == null || sb == null) continue;
        if (sa !== sb) return sa - sb;
      }
      var ia = initialOrder.indexOf(aUid);
      var ib = initialOrder.indexOf(bUid);
      if (ia !== -1 && ib !== -1) return ia - ib;
      return 0;
    }

    return uids.slice().sort(function (aUid, bUid) {
      var sa = scoreOf(prev, aUid), sb = scoreOf(prev, bUid);
      if (sa != null && sb != null && sa !== sb) return sa - sb;
      return walkBack(aUid, bUid);
    });
  }

  /* ------------------------------------------------ 라운드 전체 재계산 */

  function normalizeRound(round) {
    var r = round || {};
    var mode = r.mode === MODE.OJANG ? MODE.OJANG : MODE.YDC;
    var totalHoles = Math.max(1, Math.round(num(r.totalHoles) || 18));
    var baseBet = Math.max(0, Math.round(num(r.baseBet)));

    var initialPlayers = [];
    var seen = {};
    (r.initialPlayers || []).forEach(function (p, i) {
      var uid = p && p.uid ? String(p.uid) : 'p' + (i + 1);
      if (seen[uid]) return;
      seen[uid] = true;
      initialPlayers.push({
        uid: uid,
        name: String((p && p.name) || ('플레이어 ' + (i + 1))).slice(0, 20)
      });
    });

    var sideConfig = {
      nearest: { enabled: false, holes: [] },
      longest: { enabled: false, holes: [] }
    };
    ['nearest', 'longest'].forEach(function (t) {
      var c = r.sideConfig && r.sideConfig[t];
      if (!c) return;
      var holes = (c.holes || []).map(function (h) { return Math.round(num(h)); })
        .filter(function (h) { return h >= 1 && h <= totalHoles; });
      holes = holes.filter(function (h, i) { return holes.indexOf(h) === i; })
        .sort(function (a, b) { return a - b; }).slice(0, 4);
      sideConfig[t] = { enabled: !!c.enabled && holes.length > 0, holes: holes };
    });

    var history = [];
    var usedHoles = {};
    (r.history || []).forEach(function (e) {
      if (!e) return;
      var hole = Math.round(num(e.hole));
      if (hole < 1 || hole > totalHoles) return;
      if (usedHoles[hole]) return;           // 같은 홀 중복 기록은 무시
      var uids = (e.uids || []).map(String);
      if (!uids.length) return;
      for (var i = 0; i < uids.length; i++) if (!seen[uids[i]]) return; // 모르는 선수 → 무시
      var scores = uids.map(function (u, i) {
        return clampScore(e.scores && e.scores[i] != null ? e.scores[i] : 0);
      });
      usedHoles[hole] = true;
      history.push({
        hole: hole,
        uids: uids,
        scores: scores,
        doubleBy: e.doubleBy ? String(e.doubleBy) : null,
        sides: e.sides || {},
        note: e.note || ''
      });
    });
    history.sort(function (a, b) { return a.hole - b.hole; });

    return {
      id: String(r.id || ''),
      title: String(r.title || ''),
      mode: mode,
      baseBet: baseBet,
      totalHoles: totalHoles,
      createdAt: r.createdAt || null,
      finishedAt: r.finishedAt || null,
      initialPlayers: initialPlayers,
      sideConfig: sideConfig,
      history: history
    };
  }

  /**
   * history 와 initialPlayers 만으로 라운드 전체를 다시 계산한다.
   * net, points, 남은 더블, 이월 횟수, 오너 순서, 모든 이체 내역이 여기서 나온다.
   */
  function recomputeRound(round) {
    var r = normalizeRound(round);
    var mode = r.mode;
    var base = r.baseBet;

    var players = r.initialPlayers.map(function (p) {
      return {
        uid: p.uid, name: p.name,
        net: 0, points: 0,
        doubles: mode === MODE.OJANG ? 2 : 0,
        score: 0
      };
    });
    var byUid = {};
    players.forEach(function (p) { byUid[p.uid] = p; });

    var sidePot = { nearest: 0, longest: 0 };
    var holes = [];
    var prevScores = null;

    r.history.forEach(function (entry) {
      var scores = entry.scores.slice();
      var ruleAnalysis = prevScores
        ? analysisFor(mode, prevScores)
        : { mult: 1, notes: ['첫 홀 · 기본 배율'], candidates: [1] };

      // 오장 모드 수동 더블: 규칙 배율이 2 미만일 때만, 1홀 1회, 1인 2회까지
      var doubleBy = null;
      var doubleRefused = null;
      if (entry.doubleBy && byUid[entry.doubleBy]) {
        var owner = byUid[entry.doubleBy];
        if (mode !== MODE.OJANG) doubleRefused = 'not-ojang';
        else if (ruleAnalysis.mult >= 2) doubleRefused = 'already-2x';
        else if (owner.doubles <= 0) doubleRefused = 'none-left';
        else { doubleBy = entry.doubleBy; owner.doubles -= 1; }
      }

      var mult = doubleBy ? 2 : ruleAnalysis.mult;

      var settlement = settlementForHole(scores, base, mult);
      var perfIdx = performanceTransfers(scores, base, mult);

      // 모든 이체 내역은 선수 uid 기준으로 통일한다(화면·공유가 그대로 쓴다).
      var pairwise = settlement.pairwise.map(function (t) {
        return { from: entry.uids[t.from], to: entry.uids[t.to], amount: t.amount };
      });
      var perf = perfIdx.map(function (t) {
        return { from: entry.uids[t.from], to: entry.uids[t.to], amount: t.amount, units: t.units };
      });

      var sides = {};
      ['nearest', 'longest'].forEach(function (type) {
        var cfg = r.sideConfig[type];
        if (!cfg || !cfg.enabled) return;
        if (cfg.holes.indexOf(entry.hole) === -1) return;
        var raw = (entry.sides && entry.sides[type]) || {};
        var decision = raw.decision || 'accum';
        var winners = (raw.winners || []).map(String).filter(function (u) { return !!byUid[u]; });
        var out = {
          type: type, decision: decision, winners: winners,
          potBefore: sidePot[type], transfers: [], unit: 0, potPaid: 0
        };

        if (decision === 'paid') {
          if (winners.length) {
            out.unit = sideUnit(sidePot[type], base, mult);
            out.potPaid = sidePot[type] + 1;
            var each = Math.round(out.unit / winners.length);
            var payers = entry.uids.filter(function (u) { return winners.indexOf(u) === -1; });
            payers.forEach(function (from) {
              winners.forEach(function (to) {
                out.transfers.push({ from: from, to: to, amount: each, side: type });
              });
            });
          }
          sidePot[type] = 0;
        } else if (decision === 'accum') {
          sidePot[type] += 1;
        } else if (decision === 'reset' || decision === 'void') {
          out.potBefore = sidePot[type];
          sidePot[type] = 0;
        }
        out.potAfter = sidePot[type];
        sides[type] = out;
      });

      var transfers = pairwise.slice();
      perf.forEach(function (t) { transfers.push(t); });
      ['nearest', 'longest'].forEach(function (type) {
        if (sides[type]) sides[type].transfers.forEach(function (t) { transfers.push(t); });
      });

      // 누적: 이 홀의 모든 이체(기본 + 언더파 + 사이드)를 한 번에 반영한다.
      entry.uids.forEach(function (uid, i) {
        byUid[uid].points += scores[i];
        byUid[uid].score = scores[i];
      });
      transfers.forEach(function (t) {
        byUid[t.from].net -= t.amount;
        byUid[t.to].net += t.amount;
      });

      // 이 홀만의 최소 이체 (표시용)
      var holeNet = entry.uids.map(function () { return 0; });
      transfers.forEach(function (t) {
        var fi = entry.uids.indexOf(t.from);
        var ti = entry.uids.indexOf(t.to);
        if (fi >= 0) holeNet[fi] -= t.amount;
        if (ti >= 0) holeNet[ti] += t.amount;
      });
      var holeSimplified = simplifyTransfers(holeNet).map(function (t) {
        return { from: entry.uids[t.from], to: entry.uids[t.to], amount: t.amount };
      });

      var nextAnalysis = analysisFor(mode, scores);

      holes.push({
        hole: entry.hole,
        uids: entry.uids.slice(),
        scores: scores,
        mult: mult,
        ruleMult: ruleAnalysis.mult,
        multNotes: ruleAnalysis.notes,
        doubleBy: doubleBy,
        doubleRefused: doubleRefused,
        pairwise: pairwise,
        perf: perf,
        sides: sides,
        transfers: transfers,
        simplified: holeSimplified,
        nextMult: nextAnalysis.mult,
        nextNotes: nextAnalysis.notes,
        note: entry.note || ''
      });

      prevScores = scores;
    });

    var last = holes.length ? holes[holes.length - 1] : null;
    var nextHole = last ? Math.min(r.totalHoles, last.hole + 1) : 1;
    var finished = !!r.finishedAt || (holes.length >= r.totalHoles && last && last.hole >= r.totalHoles);

    var teeOrder = teeOrderUids(holes, r.initialPlayers.map(function (p) { return p.uid; }),
      finished ? r.totalHoles + 1 : nextHole);

    // ---- YDC 모드 라운드 최종 정산 (총 타수 기준, 잘 친 사람 → 못 친 사람) ----
    var roundEndRows = [];
    if (mode === MODE.YDC && holes.length) {
      for (var i = 0; i < players.length; i++) {
        for (var j = 0; j < players.length; j++) {
          if (i === j) continue;
          if (players[i].points < players[j].points) {
            roundEndRows.push({
              from: players[i].uid,
              to: players[j].uid,
              amount: (players[j].points - players[i].points) * base,
              diff: players[j].points - players[i].points
            });
          }
        }
      }
    }
    var roundEndAdjust = {};
    players.forEach(function (p) { roundEndAdjust[p.uid] = 0; });
    roundEndRows.forEach(function (t) {
      roundEndAdjust[t.from] -= t.amount;
      roundEndAdjust[t.to] += t.amount;
    });

    // 최종 정산(홀 정산 + 라운드 정산)을 한 번에 상계
    var finalNetArr = players.map(function (p) { return p.net + roundEndAdjust[p.uid]; });
    var finalSettlements = simplifyTransfers(finalNetArr).map(function (t) {
      return { from: players[t.from].uid, to: players[t.to].uid, amount: t.amount };
    });
    var holeOnlySettlements = simplifyTransfers(players.map(function (p) { return p.net; })).map(function (t) {
      return { from: players[t.from].uid, to: players[t.to].uid, amount: t.amount };
    });

    return {
      version: VERSION,
      round: r,
      mode: mode,
      baseBet: base,
      totalHoles: r.totalHoles,
      players: players,
      byUid: byUid,
      holes: holes,
      holeCount: holes.length,
      nextHole: finished ? r.totalHoles : nextHole,
      finished: finished,
      teeOrderUids: teeOrder,
      sidePot: sidePot,
      lastHole: last,
      roundEnd: {
        rows: roundEndRows,
        adjust: roundEndAdjust,
        finalNet: finalNetArr,
        settlements: finalSettlements,
        holeOnlySettlements: holeOnlySettlements
      },
      nextAnalysis: last ? analysisFor(mode, last.scores) : { mult: 1, notes: ['첫 홀 · 기본 배율'], candidates: [1] }
    };
  }

  /* ------------------------------------------------------------- 검증 */

  function validateRound(round) {
    var problems = [];
    if (!round || typeof round !== 'object') return { ok: false, problems: ['라운드 데이터가 없습니다.'] };
    var players = round.initialPlayers || [];
    if (players.length < 2) problems.push('선수가 2명 이상이어야 합니다.');
    if (players.length > 4) problems.push('선수는 최대 4명입니다.');
    var names = players.map(function (p) { return (p.name || '').trim(); });
    names.forEach(function (n, i) { if (!n) problems.push((i + 1) + '번 선수 이름이 비어 있습니다.'); });
    if (!round.totalHoles || round.totalHoles < 1) problems.push('홀 수가 올바르지 않습니다.');
    var holes = (round.history || []).map(function (h) { return h.hole; });
    for (var i = 1; i < holes.length; i++) {
      if (holes[i] !== holes[i - 1] + 1) { problems.push('홀 기록이 연속되지 않습니다.'); break; }
    }
    return { ok: problems.length === 0, problems: problems };
  }

  /* --------------------------------------------------- 공유용 텍스트 */

  function pad(s, n) {
    s = String(s);
    var w = 0;
    for (var i = 0; i < s.length; i++) w += (s.charCodeAt(i) > 255 ? 2 : 1);
    var out = s;
    while (w < n) { out += ' '; w += 1; }
    return out;
  }

  function buildShareText(view, opts) {
    opts = opts || {};
    var r = view.round;
    var nameOf = {};
    view.players.forEach(function (p) { nameOf[p.uid] = p.name; });

    var modeLabel = view.mode === MODE.OJANG ? '오장 모드' : 'YDC 모드';
    var lines = [];
    var title = (r.title || '').trim() || ('YDC 골프 내기 · ' + modeLabel);
    lines.push('⛳ ' + title);
    lines.push(modeLabel + ' · ' + view.totalHoles + '홀 · 기본 ' + won(view.baseBet) + '/타');
    lines.push('');

    // 최종 순위 (최종 정산액 기준)
    var ranked = view.players.map(function (p, i) {
      return { name: p.name, net: p.net, adj: view.roundEnd.adjust[p.uid] || 0, final: view.roundEnd.finalNet[i], points: p.points };
    }).sort(function (a, b) { return b.final - a.final; });

    lines.push('■ 최종 결과');
    ranked.forEach(function (p, i) {
      var sign = p.final > 0 ? '+' : p.final < 0 ? '-' : '';
      lines.push((i + 1) + '. ' + p.name + '  ' + p.points + '타  ' + sign + won(Math.abs(p.final)));
    });
    lines.push('');

    // 정산 내역
    lines.push('■ 정산');
    if (view.roundEnd.settlements.length === 0) {
      lines.push('정산할 금액이 없습니다.');
    } else {
      view.roundEnd.settlements.forEach(function (t) {
        lines.push(nameOf[t.from] + ' → ' + nameOf[t.to] + ': ' + won(t.amount));
      });
    }

    if (opts.includeHoles && view.holes.length) {
      lines.push('');
      lines.push('■ 홀별 배율');
      var parts = view.holes.map(function (h) {
        return 'H' + h.hole + ' ×' + h.mult;
      });
      lines.push(parts.join(' · '));
    }

    var receive = 0, pay = 0;
    view.roundEnd.finalNet.forEach(function (v) { if (v > 0) receive += v; else pay += -v; });
    lines.push('');
    lines.push('받을 돈 합계 ' + won(receive) + ' / 줄 돈 합계 ' + won(pay));
    return lines.join('\n');
  }

  return {
    VERSION: VERSION,
    MODE: MODE,
    SCORE_MIN: SCORE_MIN,
    SCORE_MAX: SCORE_MAX,
    underParUnits: underParUnits,
    clampScore: clampScore,
    won: won,
    signedWon: signedWon,
    scoreName: scoreName,
    ydcAnalysis: ydcAnalysis,
    ojangAnalysis: ojangAnalysis,
    analysisFor: analysisFor,
    nextMultiplier: nextMultiplier,
    settlementForHole: settlementForHole,
    performanceTransfers: performanceTransfers,
    simplifyTransfers: simplifyTransfers,
    sideUnit: sideUnit,
    teeOrderUids: teeOrderUids,
    normalizeRound: normalizeRound,
    recomputeRound: recomputeRound,
    validateRound: validateRound,
    buildShareText: buildShareText
  };
})();</script>
  <script>/* ============================================================================
 * YDC Golf Bet — 저장소
 *
 * localStorage 를 1차 저장(동기, 즉시)으로 쓰고 IndexedDB 를 백업으로 둔다.
 * 네트워크는 전혀 쓰지 않는다. 저장에 실패해도 앱은 계속 동작한다.
 * ==========================================================================*/
var Store = (function () {
  'use strict';

  var KEY = {
    prefs: 'ydcgb:v1:prefs',
    active: 'ydcgb:v1:active',
    archive: 'ydcgb:v1:archive',
    theme: 'ydcgb:v1:theme'
  };

  var memory = {};        // localStorage 를 못 쓸 때(사생활 보호 모드 등) 대체 저장소
  var lsOK = (function () {
    try {
      var k = '__ydcgb_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })();

  function get(k) {
    try {
      if (lsOK) return window.localStorage.getItem(k);
    } catch (e) {}
    return memory[k] === undefined ? null : memory[k];
  }

  function set(k, v) {
    memory[k] = v;
    try {
      if (lsOK) { window.localStorage.setItem(k, v); return true; }
    } catch (e) {}
    return false;
  }

  function del(k) {
    delete memory[k];
    try { if (lsOK) window.localStorage.removeItem(k); } catch (e) {}
  }

  function readJSON(k, fallback) {
    var raw = get(k);
    if (!raw) return fallback;
    try {
      var v = JSON.parse(raw);
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  }

  function writeJSON(k, v) {
    try { return set(k, JSON.stringify(v)); } catch (e) { return false; }
  }

  /* ---------------------------------------------------- IndexedDB 백업 */

  var dbPromise = null;

  function idb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('no-idb')); return; }
      var req;
      try { req = window.indexedDB.open('ydc-golf-bet', 1); }
      catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb-open-failed')); };
      req.onblocked = function () { reject(new Error('idb-blocked')); };
    });
    return dbPromise;
  }

  function idbPut(key, value) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error); };
      });
    });
  }

  function idbGet(key) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readonly');
        var rq = tx.objectStore('kv').get(key);
        rq.onsuccess = function () { resolve(rq.result || null); };
        rq.onerror = function () { reject(rq.error); };
      });
    });
  }

  /* -------------------------------------------------------------- 공개 */

  function loadPrefs() {
    var p = readJSON(KEY.prefs, null);
    if (!p || typeof p !== 'object') return null;
    return p;
  }

  function savePrefs(prefs) {
    return writeJSON(KEY.prefs, prefs || {});
  }

  function loadTheme() {
    var t = get(KEY.theme);
    return (t === 'light' || t === 'dark' || t === 'auto') ? t : 'light';
  }

  function saveTheme(t) { set(KEY.theme, t); }

  // 진행 중인 라운드: localStorage → (없으면) IndexedDB
  function saveActive(round) {
    var ok = writeJSON(KEY.active, round);
    // IndexedDB 백업은 기다리지 않는다(실패해도 무시).
    try { idbPut('active', round).catch(function () {}); } catch (e) {}
    return ok;
  }

  function loadActiveSync() {
    var r = readJSON(KEY.active, null);
    if (r && r.initialPlayers && r.history) return r;
    return null;
  }

  function loadActiveAsync() {
    var sync = loadActiveSync();
    if (sync) return Promise.resolve(sync);
    return idbGet('active').then(function (r) {
      if (r && r.initialPlayers && r.history) {
        writeJSON(KEY.active, r);   // 복구
        return r;
      }
      return null;
    }).catch(function () { return null; });
  }

  function clearActive() {
    del(KEY.active);
    try { idbPut('active', null).catch(function () {}); } catch (e) {}
  }

  function loadArchive() {
    var list = readJSON(KEY.archive, []);
    return Array.isArray(list) ? list : [];
  }

  function loadArchiveAsync() {
    var sync = loadArchive();
    if (sync.length) return Promise.resolve(sync);
    return idbGet('archive').then(function (list) {
      return Array.isArray(list) ? list : [];
    }).catch(function () { return []; });
  }

  function addToArchive(round) {
    if (!round || !round.id) return loadArchive();
    var list = loadArchive().filter(function (r) { return r.id !== round.id; });
    list.unshift(round);
    if (list.length > 30) list = list.slice(0, 30);
    writeJSON(KEY.archive, list);
    try { idbPut('archive', list).catch(function () {}); } catch (e) {}
    return list;
  }

  function removeFromArchive(id) {
    var list = loadArchive().filter(function (r) { return r.id !== id; });
    writeJSON(KEY.archive, list);
    try { idbPut('archive', list).catch(function () {}); } catch (e) {}
    return list;
  }

  function newId() {
    try {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    } catch (e) {}
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function newUid() {
    return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  return {
    KEY: KEY,
    lsOK: lsOK,
    get: get, set: set, del: del,
    readJSON: readJSON, writeJSON: writeJSON,
    loadPrefs: loadPrefs, savePrefs: savePrefs,
    loadTheme: loadTheme, saveTheme: saveTheme,
    saveActive: saveActive,
    loadActiveSync: loadActiveSync,
    loadActiveAsync: loadActiveAsync,
    clearActive: clearActive,
    loadArchive: loadArchive,
    loadArchiveAsync: loadArchiveAsync,
    addToArchive: addToArchive,
    removeFromArchive: removeFromArchive,
    newId: newId,
    newUid: newUid
  };
})();</script>
  <script>/* ============================================================================
 * YDC Golf Bet — 화면
 *
 * 원칙
 *  - 네트워크를 쓰지 않는다(요청 0건). 모든 계산은 YDC(규칙 엔진)에서만 한다.
 *  - 상태 변경 → 즉시 저장 → 다시 그리기. 화면과 저장본이 어긋날 수 없다.
 *  - 모든 입력은 이벤트 위임(data-act)으로 처리한다. 리스너가 쌓여 멈추는 일 없음.
 * ==========================================================================*/
var App = (function () {
  'use strict';

  var S = {
    round: null,        // 현재 라운드(저장 형식 그대로)
    screen: 'home',     // home | setup | play | result | summary | archive
    reading: null,      // 지난 라운드 열람용
    setup: null,
    theme: 'light',
    pending: false      // 처리 중 중복 탭 방지
  };

  var R = null;         // 현재 라운드의 재계산 결과 캐시

  /* ------------------------------------------------------------- 유틸 */

  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function won(n) { return YDC.won(n); }
  function signed(n) { return YDC.signedWon(n); }
  function modeLabel(mode) { return mode === 'ojang' ? '오장 모드' : 'YDC 모드'; }

  function toast(msg, ms) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 1900);
  }

  function haptic() {
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
  }

  function todayLabel(ts) {
    var d = ts ? new Date(ts) : new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
  }

  /* ------------------------------------------------------------- 모달 */

  var modalResolve = null;

  function closeModal(result) {
    var back = $('#modalBack');
    if (back) back.parentNode.removeChild(back);
    if (modalResolve) {
      var r = modalResolve;
      modalResolve = null;
      r(result);
    }
  }

  function showModal(opts) {
    closeModal(null);
    var actionsHTML = (opts.buttons || [{ label: '확인', value: 'ok', kind: 'primary' }]).map(function (b) {
      return '<button class="btn ' + (b.kind === 'primary' ? 'btn-primary' : b.kind === 'gold' ? 'btn-gold'
        : b.kind === 'danger' ? 'btn-danger' : 'btn-ghost') + '" data-modal="' + esc(b.value) + '">' +
        esc(b.label) + '</button>';
    }).join('');

    var back = document.createElement('div');
    back.className = 'modal-back';
    back.id = 'modalBack';
    back.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        (opts.title ? '<h3>' + esc(opts.title) + '</h3>' : '') +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        '<div class="modal-actions">' + actionsHTML + '</div>' +
      '</div>';

    return new Promise(function (resolve) {
      modalResolve = resolve;
      back.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-modal]');
        if (btn) {
          var v = btn.getAttribute('data-modal');
          document.body.removeChild(back);

        }
        if (e.target === back) {
          document.body.removeChild(back);
          if (modalResolve) { var r2 = modalResolve; modalResolve = null; r2(null); }
        }
      });
    });
  }

  function confirmModal(title, body, okLabel, danger) {
    return showModal({
      title: title,
      body: body,
      buttons: [
        { label: okLabel || '확인', value: 'ok', kind: danger ? 'danger' : 'primary' },
        { label: '취소', value: 'no', kind: 'ghost' }

    }).then(function (v) { return v === 'ok'; });
  }

  /* --------------------------------------------------------- 저장/계산 */

  function recompute() {
    R = S.round ? YDC.recomputeRound(S.round) : null;
    return R;
  }

  function save() {
    if (!S.round || S.reading) return;
    S.round.screen = S.screen;
    Store.saveActive(S.round);
  }

  function nameOf(uid) {
    if (!R) return uid;
    return (R.byUid[uid] && R.byUid[uid].name) || uid;
  }

  /* --------------------------------------------------------- 문구/뷰 조각 */

  function header() {
    var home = S.screen !== 'home'
      ? '<button class="icon-btn" data-act="nav:home" aria-label="홈">⌂</button>' : '';
    var dark = S.theme === 'dark';
    return '' +
      '<div class="topbar">' +
        '<div class="brand"><span class="flag">⛳</span><span>YDC 골프 내기</span></div>' +
        '<div class="spacer"></div>' +
        '<button class="icon-btn" data-act="ui:theme" aria-label="화면 테마">' + (dark ? '☀' : '☾') + '</button>' +
        home +
      '</div>';
  }

  function txList(rows) {
    if (!rows || !rows.length) return '<div class="empty">주고받을 돈이 없습니다.</div>';
    return '<ul class="tx-list">' + rows.map(function (t) {
      return '<li><span class="who">' + esc(nameOf(t.from)) + ' → ' + esc(nameOf(t.to)) + '</span>' +
        '<span class="amt">' + won(t.amount) + '</span></li>';

  function netClass(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : ''; }

  /* ------------------------------------------------------------- 홈 */

  function viewHome() {

    var finished = active && active.finishedAt;
    var archive = Store.loadArchive();

    var continueCard = '';
    if (active) {

          '<div class="small muted">' + modeLabel(active.mode) + ' · ' + av.holeCount + '/' + active.totalHoles +

          '<div class="mt"><button class="btn btn-primary" data-act="nav:resume">' +

        '</div>';

      var bestIdx = 0;
      for (var bi = 1; bi < v.roundEnd.finalNet.length; bi++) {
        if (v.roundEnd.finalNet[bi] > v.roundEnd.finalNet[bestIdx]) bestIdx = bi;
      }

      return '<div class="round-item">' +
        '<div class="grow">' +
          '<div class="title">' + esc((r.title || '').trim() || '라운드') + '</div>' +
          '<div class="tiny muted">' + todayLabel(r.createdAt) + ' · ' + modeLabel(r.mode) + ' · ' +
            v.holeCount + '홀 · 1위 ' + esc(topName) + ' ' + signed(topVal) + '</div>' +
        '</div>' +
        '<button class="btn btn-soft btn-sm" data-act="archive:open" data-id="' + esc(r.id) + '">보기</button>' +
      '</div>';
    }).join('');

    return header() +
      '<div class="hero">' +
        '<h1>YDC 골프 내기</h1>' +
        '<p>홀마다 자동 저장 · <span class="gold">인터넷 없이</span> 그대로 동작</p>' +
      '</div>' +
      continueCard +
      '<button class="btn btn-gold" data-act="nav:setup" style="min-height:60px;font-size:1.12rem">＋ 새 라운드 시작</button>' +
      '<div class="section-label">지난 라운드</div>' +
      '<div class="card tight">' +
        (list || '<div class="empty">아직 저장된 라운드가 없습니다.</div>') +
        (archive.length > 3 ? '<button class="btn btn-ghost btn-sm" data-act="nav:archive" style="width:100%;margin-top:10px">전체 ' + archive.length + '개 보기</button>' : '') +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" data-act="ui:rules" style="width:100%;margin-bottom:12px">규칙 보기</button>' +
      '<div class="card tight">' +
        '<div class="small bold">아이폰 홈 화면에 추가</div>' +
        '<div class="tiny muted mt">사파리에서 이 페이지를 연 뒤 <b>공유 → 홈 화면에 추가</b>를 누르면 앱처럼 열려요. 한 번 열어 두면 비행기 모드에서도 실행됩니다.</div>' +

  /* ------------------------------------------------------------- 설정 */

  function defaultSetup() {
    var prefs = Store.loadPrefs() || {};
    return {
      mode: prefs.mode === 'ojang' ? 'ojang' : 'ydc',

    for (var h = 1; h <= cfg.totalHoles; h++) {
